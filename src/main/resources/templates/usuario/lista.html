<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/head :: head}"></head>

<body>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">

                <!-- Header con título y botón nuevo -->
                <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                    <div class="welcome-section">
                        <h1 class="welcome-title">
                            <i class="bi bi-people me-2"></i>
                            Gestión de Usuarios
                        </h1>
                        <p class="welcome-subtitle">
                            Administra los usuarios del sistema
                        </p>
                    </div>
                    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">
                        <i class="bi bi-plus-circle me-2"></i>
                        Nuevo Usuario
                    </a>
                </div>

                <!-- Alertas -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${success}">Operación exitosa</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Error en la operación</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Tabla de usuarios -->
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4">NOMBRE</th>
                                        <th>USUARIO</th>
                                        <th>EMAIL</th>
                                        <th>ROL</th>
                                        <th>ESTADO</th>
                                        <th class="text-end pe-4">ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="usuario : ${usuarios}">
                                        <td class="ps-4">
                                            <div class="fw-semibold" th:text="${usuario.nombre}">Nombre</div>
                                        </td>
                                        <td>
                                            <span th:text="${usuario.nombreUsuario}">usuario</span>
                                        </td>
                                        <td>
                                            <span th:text="${usuario.email}">email@email.com</span>
                                        </td>
                                        <td>
                                            <span class="badge bg-primary bg-opacity-10 text-primary"
                                                th:if="${usuario.rol == 'ADMIN'}">
                                                <i class="bi bi-shield-lock me-1"></i>
                                                Administrador
                                            </span>
                                            <span class="badge bg-info bg-opacity-10 text-info"
                                                th:if="${usuario.rol == 'CAJERO'}">
                                                <i class="bi bi-cash-register me-1"></i>
                                                Cajero
                                            </span>
                                        </td>
                                        <td>
                                            <span class="badge bg-success bg-opacity-10 text-success"
                                                th:if="${usuario.estaActivo}">
                                                <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>
                                                Activo
                                            </span>
                                            <span class="badge bg-secondary bg-opacity-10 text-secondary"
                                                th:unless="${usuario.estaActivo}">
                                                <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>
                                                Inactivo
                                            </span>
                                        </td>
                                        <td class="text-end pe-4">
                                            <div class="action-buttons">
                                                <a th:href="@{/usuarios/ver/{id}(id=${usuario.id})}"
                                                    class="btn btn-sm btn-outline-info" title="Ver detalle">
                                                    <i class="bi bi-eye"></i>
                                                </a>
                                                <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                                                    class="btn btn-sm btn-outline-primary" title="Editar">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                                                    class="btn btn-sm btn-outline-danger" title="Eliminar"
                                                    onclick="return confirm('¿Estás seguro de eliminar este usuario?')">
                                                    <i class="bi bi-trash"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${usuarios.empty}">
                                        <td colspan="6" class="text-center py-5 text-secondary">
                                            <i class="bi bi-people display-4 d-block mb-3"></i>
                                            No hay usuarios para mostrar
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- FOOTER -->
                <div th:replace="~{fragments/footer :: footer}"></div>

            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
