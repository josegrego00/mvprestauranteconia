<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/head :: head}"></head>

<body>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">

                <!-- Header con acciones -->
                <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                    <div class="welcome-section">
                        <h1 class="welcome-title">
                            <i class="bi bi-info-circle me-2"></i>
                            Detalle del Usuario
                        </h1>
                        <p class="welcome-subtitle" th:text="${usuarioDTO.nombre}">
                            Juan Pérez
                        </p>
                    </div>
                    <div>
                        <a th:href="@{/usuarios/editar/{id}(id=${usuarioDTO.id})}" class="btn btn-primary me-2">
                            <i class="bi bi-pencil me-2"></i>
                            Editar
                        </a>
                        <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-2"></i>
                            Volver
                        </a>
                    </div>
                </div>

                <!-- Detalles -->
                <div class="row">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header bg-white py-3">
                                <h5 class="mb-0 fw-semibold">
                                    <i class="bi bi-person me-2"></i>
                                    Información del Usuario
                                </h5>
                            </div>
                            <div class="card-body">
                                <table class="table table-borderless">
                                    <tr>
                                        <td class="text-secondary" width="200">Nombre:</td>
                                        <td class="fw-semibold" th:text="${usuarioDTO.nombre}">Juan Pérez</td>
                                    </tr>
                                    <tr>
                                        <td class="text-secondary">Nombre de Usuario:</td>
                                        <td th:text="${usuarioDTO.nombreUsuario}">juan.perez</td>
                                    </tr>
                                    <tr>
                                        <td class="text-secondary">Email:</td>
                                        <td th:text="${usuarioDTO.email}">juan@email.com</td>
                                    </tr>
                                    <tr>
                                        <td class="text-secondary">Rol:</td>
                                        <td>
                                            <span class="badge bg-primary bg-opacity-10 text-primary"
                                                th:if="${usuarioDTO.rol == 'ADMIN'}">
                                                <i class="bi bi-shield-lock me-1"></i>
                                                Administrador
                                            </span>
                                            <span class="badge bg-info bg-opacity-10 text-info"
                                                th:if="${usuarioDTO.rol == 'CAJERO'}">
                                                <i class="bi bi-cash-register me-1"></i>
                                                Cajero
                                            </span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-secondary">Estado:</td>
                                        <td>
                                            <span class="badge bg-success" th:if="${usuarioDTO.estaActivo}">
                                                <i class="bi bi-check-circle me-1"></i>
                                                Activo
                                            </span>
                                            <span class="badge bg-secondary" th:unless="${usuarioDTO.estaActivo}">
                                                <i class="bi bi-x-circle me-1"></i>
                                                Inactivo
                                            </span>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Card de información -->
                    <div class="col-md-4">
                        <div class="card bg-primary text-white mb-4">
                            <div class="card-body text-center py-4">
                                <i class="bi bi-person-circle display-4 d-block mb-3"></i>
                                <h5 class="fw-bold" th:text="${usuarioDTO.nombre}">Juan Pérez</h5>
                                <p class="mb-0 opacity-75" th:text="${usuarioDTO.rol}">ADMIN</p>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-body">
                                <h6 class="fw-semibold mb-3">
                                    <i class="bi bi-info-circle me-2"></i>
                                    Estado de Cuenta
                                </h6>
                                <p class="mb-0">
                                    <span th:if="${usuarioDTO.estaActivo}" class="text-success">
                                        <i class="bi bi-check-circle-fill me-1"></i>
                                        Cuenta activa
                                    </span>
                                    <span th:unless="${usuarioDTO.estaActivo}" class="text-secondary">
                                        <i class="bi bi-x-circle-fill me-1"></i>
                                        Cuenta inactiva
                                    </span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- FOOTER -->
                <div th:replace="~{fragments/footer :: footer}"></div>

            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
