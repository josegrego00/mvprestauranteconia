<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subdominio no encontrado - MVP Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <style>
        .error-icon {
            color: #e74a3b;
        }
        .info-card {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #4e73df;
        }
        .info-card h5 {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .info-card ul {
            margin: 0;
            padding-left: 1.25rem;
            color: #6c757d;
        }
        .info-card li {
            margin-bottom: 0.5rem;
        }
        .btn-primary-custom {
            background: #4e73df;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary-custom:hover {
            background: #224abe;
            transform: translateY(-2px);
            color: white;
        }
        .btn-outline-custom {
            background: transparent;
            border: 2px solid #6c757d;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-outline-custom:hover {
            background: #6c757d;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="register-card">

                    <div class="register-header">
                        <i class="bi bi-exclamation-triangle-fill error-icon"></i>
                        <h2>Subdominio no encontrado</h2>
                        <p>El subdominio no existe en nuestro sistema</p>
                    </div>

                    <div class="info-card">
                        <h5>
                            <i class="bi bi-info-circle me-2"></i>
                            ¿Qué puedes hacer?
                        </h5>
                        <ul>
                            <li>Verifica que el nombre del subdominio esté correcto</li>
                            <li>Contacta al administrador del sistema</li>
                            <li>Si eres el propietario, registra tu empresa</li>
                        </ul>
                    </div>

                    <div class="d-flex gap-3 justify-content-center mt-4">
                        <a href="http://localhost:8080" class="btn-primary-custom">
                            <i class="bi bi-house me-2"></i>
                            Ir al inicio
                        </a>
                        <a href="http://localhost:8080/registro" class="btn-outline-custom">
                            <i class="bi bi-person-plus me-2"></i>
                            Registrar Empresa
                        </a>
                    </div>

                    <div class="register-footer">
                        <p class="mb-0">
                            <i class="bi bi-shield-lock"></i>
                            Sistema de Gestión Empresarial
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
