<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Superadmin | Sistema de Gestión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="register-card">

                    <div class="register-header">
                        <i class="bi bi-shield-lock"></i>
                        <h2>Superadmin</h2>
                        <p>Ingrese sus credenciales para acceder</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        Usuario o contraseña incorrectos
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success">
                        <i class="bi bi-check-circle-fill"></i>
                        Ha cerrado sesión exitosamente
                    </div>

                    <div th:if="${param.passwordChanged}" class="alert alert-success">
                        <i class="bi bi-check-circle-fill"></i>
                        Contraseña cambiada correctamente. Inicie sesión con su nueva contraseña
                    </div>

                    <form th:action="@{/superadmin/login}" method="post">

                        <div class="mb-4">
                            <label class="form-label">
                                <i class="bi bi-person"></i>
                                Usuario
                            </label>
                            <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario"
                                required autofocus>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                <i class="bi bi-lock"></i>
                                Contraseña
                            </label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i>
                            Iniciar Sesión
                        </button>
                    </form>

                    <div class="register-footer">
                        <p class="mb-2">
                            <i class="bi bi-gear"></i>
                            Gestión de Empresas
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
